<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мыслитель (Редакция)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мыслитель</h1>
        <p>Кликните по строке, чтобы выбрать цвета. Нажмите Enter для оценки.</p>

        <div class="row answer-row" id="answer-row">
            <div class="cell answer-cell" id="answer-0"></div>
            <div class="cell answer-cell" id="answer-1"></div>
            <div class="cell answer-cell" id="answer-2"></div>
            <div class="cell answer-cell" id="answer-3"></div>
        </div>

        <div id="game-board"></div>

        <div class="controls">
            <button id="new-game-btn">Новая игра</button>
            <div id="message"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
